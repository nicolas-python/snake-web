<!-- Struktur der Seite -->
<!DOCTYPE html>                         <!--<!DOCTYPE html>=Diese Datei ist eine moderne HTML5-Webseite -->
<html lang="de">                        <!-- Beginn der HTML-Seite, Sprache = Deutsch sagt an deutscher inhalt -->

<head>                                  <!--  enthält informationen über die webseite, die nicht direkt angezeigt werden -->
    <meta charset="UTF-8">
    <title>Snake Game</title>

    <style>
        h1                          /*titel*/
        {
        text-align: center;
        }

        #game
        {
        display: block;                      /* macht das Canvas zu einem Block-Element */
        margin: 0 auto;                      /* margin = Außenabstand , auto = links und rechts automatisch verteilen*/
        border: 1px solid black;             /* zeichnet einen schwarzen Rand:1px = Dicke , solid = durchgezogene Linie ,black = Farbe */
        }

        #gameOverBox
        {
            position: absolute;
            top: 100px;                      /* weiter runter = größerer Wert */
            left: 50%;                       /*mittig*/
            transform: translateX(-50%);

            width: 300px;

            display: none;

            text-align: center;

            background: rgba(0,0,0,0);
            color: white;
            padding: 20px;
            border-radius: 10px;
        }

        #gameOverText
        {
            font-size: 40px;                /* größe */
            font-weight: 600;               /* dicke */
            text-align: center;
        }
    </style>
</head>

<body>                                  <!-- zeigt an was ich sehen kan auf der website -->

    <h1>Welcome to Snake</h1>           <!-- h1 Überschrift ebene 1 -->
    <div id="messageHud">Bitte Spieler auswählen</div>

    <!-- Spielfeld -->
    <canvas id="game" width="400" height="400"></canvas>

    <div id="messagespecialfood"></div>

    <!-- Spieler Erstellen -->
    <input id="playerName" placeholder="Name">
    <button id="savePlayer">Spiel Starten</button>

    <!-- Schwirigkeitsgrad -->
    <button id="easyBtn">Easy</button>
    <button id="normalBtn">Normal</button>
    <button id="hardBtn">Hard</button>

    <!-- score label erstellen -->
    <div id="scoreHud">Score: 0</div>                              <!-- div = container -->

    <!-- Timer -->
    <div id="effectHud"></div>

    <!-- highscore label erstellen -->
    <div id="highscores">
        <h3>Top 3 Highscores</h3>
    </div>

    <!-- gameOver text -->
    <div id="gameOverBox">
        <p id="gameOverText">GAME OVER</p>
        <button id="restartBtn">Weiter spielen</button>
        <button id="menuBtn">Schwierigkeit ändern</button>
    </div>

    <script src="/static/game.js"></script>         <!-- lade das script game.js aus dem static ordner und fuhrt es aus -->

</body>                                     <!-- makiert das ende des sichbaren bereiches -->
</html>                                     <!-- beended die seite -->
