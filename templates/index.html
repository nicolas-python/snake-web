<!-- Struktur der Seite -->
<!DOCTYPE html>                         <!--<!DOCTYPE html>=Diese Datei ist eine moderne HTML5-Webseite -->
<html lang="de">                        <!-- Beginn der HTML-Seite, Sprache = Deutsch sagt an deutscher inhalt -->

<head>                                  <!--  enthält informationen über die webseite, die nicht direkt angezeigt werden -->
    <meta charset="UTF-8">
    <title>Snake Game</title>

    <style>

        html, body               /*greift auf die ganze Website zu*/
        {
        margin: 0;               /*entfernt standart abstand vom browser*/
        min-height: 100vh;        /*vh = viewport height (Bildschirmhöhe)*/
        }

        body
        {
        background-image: url("/static/snake_img/menu_web.png");
        background-size: cover;             /*Bild wird so vergrößert, dass es den kompletten Bildschirm füllt*/
        background-repeat: no-repeat;
        background-position: center;
        }

        h1                          /*titel*/
        {
        text-align: center;
        color : green;
        font-size: 40px;
        font-weight: bold;
        text-shadow: 0 0 10px;              /*glow effekt*/
        }

        #layout
        {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 40px;
        margin-top: 50px;

        transform: translateX(-90px);
        }

        #gameContainer
        {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        }

        #effectHud
        {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        }

        #messageHud
        {
        text-align: center;
        margin-top: 10px;
        font-size: 18px;
        font-weight: bold;
        }

       #messagespecialfood
       {
        position: absolute;
        left: 50%;
        top: 40%;
        pointer-events: none;
        font-size: 30px;
        font-weight: 500;
        }

        #menu
        {
        display: flex;
        flex-direction: column;
        gap: 10px;
        }

        #game
        {
        display: block;                      /* macht das Canvas zu einem Block-Element */
        margin: 0 auto;                      /* margin = Außenabstand , auto = links und rechts automatisch verteilen*/
        border: 3px solid lightgreen;        /* zeichnet einen schwarzen Rand:1px = Dicke , solid = durchgezogene Linie ,black = Farbe */
        background: rgba(0, 0, 0, 0.8);
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
        }

        #highscores
        {
        position: absolute;                 /*absolute; = Element frei an einer festen Position platzieren*/
        right: 150px;
        top: 150px;

        background: rgba(0, 0, 0, 0.7);
        border: 2px solid gold;
        border-radius: 10px;
        padding: 10px;
        color: white;
        font-family: Arial, sans-serif;
        box-shadow: 0 0 15px gold;
        pointer-events: none;
        }

        #highscores h3
        {
        margin: 0 0 10px 0;
        text-align: center;
        color: gold;
        }

        #controlsHud
        {
        position: absolute;

        left: 10px;
        bottom: 10px;

        color: white;
        font-size: 14px;

        background: rgba(0, 0, 0, 0.5);
        padding: 10px;
        border-radius: 8px;

        pointer-events: none;
        }

        /*Tastensymbol*/
        .key
        {
        display: inline-block;
        background: #333;
        padding: 2px 6px;
        border-radius: 4px;
        margin-right: 4px;
        font-weight: bold;
        }

        #pauseOverlay
        {
        position: absolute;
        top: 2.5px;
        left: 2.5px;

        width: 400px;
        height: 400px;

        background: rgba(0, 0, 0, 0.5);
        color: white;

        display: none;

        justify-content: center;
        align-items: center;
        font-size: 40px;
        }

        #gameOverBox
        {
            position: absolute;
            top: 100px;                      /* weiter runter = größerer Wert */
            left: 51.5%;                       /*mittig*/
            transform: translateX(-50%);

            width: 300px;

            display: none;

            text-align: center;

            background: rgba(0,0,0,0);
            color: white;
            padding: 20px;
            border-radius: 10px;
        }

        #gameOverText
        {
        font-size: 40px;                /* größe */
        font-weight: 600;               /* dicke */
        text-align: center;
        }

    </style>
</head>

<body>                                  <!-- zeigt an was ich sehen kan auf der website -->
    <!-- Titel -->
    <h1>Welcome to Snake</h1>           <!-- h1 Überschrift ebene 1 -->

    <div id="messageHud">Bitte Spieler auswählen</div>
    <div id="layout">

    <!-- Menü -->
    <div id="menu">

        <input id="playerName" placeholder="Name">

        <button id="easyBtn">Easy</button>
        <button id="normalBtn">Normal</button>
        <button id="hardBtn">Hard</button>

        <button id="startGame">Spiel Starten</button>

    </div>

    <!-- Spielfeld -->
    <div id="gameContainer">
        <canvas id="game" width="400" height="400"></canvas>
        <div id="pauseOverlay">PAUSE</div>
        <div id="messagespecialfood"></div>
        <div id="scoreHud">Score: 0</div>
        <div id="effectHud"></div>
        </div>

    </div>

     <!-- Highscore -->
    <div id="highscores">
        <h3>Top 3 Highscores</h3>
    </div>

    <!-- Game Over -->
    <div id="gameOverBox">
        <p id="gameOverText">GAME OVER</p>
        <button id="restartBtn">Weiter spielen</button>
        <button id="menuBtn">Schwierigkeit ändern</button>
    </div>

    <!-- Script -->
    <script src="/static/game.js"></script>

     <!--Funktionen -->
    <div id="controlsHud">
    <div>P = Pause</div>
    <div>↑ ↓ ← → = Bewegung</div>
    <div>🟡Score Food = + Punkte</div>
    <div>🟢Grow Food = wächst</div>
    <div>🔵Slow Food= langsamer</div>
    <div>🟣Poison Food= -10 Punkte</div>
    <div>🟠 Speed Boos Food = schneller</div>
    <div>⚪Shrink Food = kleiner</div>
</div>

</body>                                     <!-- makiert das ende des sichbaren bereiches -->
</html>                                     <!-- beended die seite -->
